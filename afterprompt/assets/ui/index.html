<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Afterprompt</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <h1 class="wordmark">Afterprompt</h1>
  <div class="bar-status">
    <span id="state" class="state" data-state="connecting" role="status"></span>
    <label class="field-label" for="theme" id="theme-label"></label>
    <select id="theme">
      <option value="auto"></option>
      <option value="light"></option>
      <option value="dark"></option>
    </select>
  </div>
</header>

<main class="panes">
  <section class="pane" aria-labelledby="list-heading">
    <h2 class="group" id="list-heading"></h2>
    <ol class="list" id="list" role="listbox" tabindex="0" aria-activedescendant=""></ol>
  </section>
  <section class="pane" data-pane="detail" id="detail" tabindex="0" aria-live="polite"></section>
</main>
</body>
</html>
