<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Afterprompt</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/logo/afterprompt-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <!-- The rail: the mark, the one action that makes this machine do something, then the screens. -->
  <nav class="rail" aria-label="Screens">
    <h1 class="rail-logo" title="Afterprompt">
      <!-- Inline, not <img>: the mark is drawn in currentColor so it follows the theme, and an external
           image cannot inherit that. -->
      <svg class="logo" width="22" height="14" viewBox="0 0 64 40" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8 L18 20 L6 32"/><circle cx="33" cy="20" r="7"/><path d="M40 20 H57"/>
        <path d="M47 20 V26"/><path d="M53 20 V25"/>
      </svg><span class="sr-only">Afterprompt</span></h1>
    <div class="rail-go" id="go"></div>
    <div class="tabs" id="tabs"></div>
    <div class="rail-foot" id="rail-foot">
      <span id="state" class="state" data-state="connecting" role="status"></span>
    </div>
  </nav>

  <div class="main">
    <main id="screen" class="screen"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>
<div id="palette" class="palette" hidden></div>
</body>
</html>
